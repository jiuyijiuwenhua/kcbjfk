  <script>
const SUPABASE_URL='https://qwovakpbpjfzcbcgyhlt.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_L1A9vngO0MFlIpMeTtu2dQ_iHRwE1LA';
const db=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const legacyData=(()=>{try{return JSON.parse(localStorage.getItem('speech-school-points-v1')||'null')}catch{return null}})();
let data={students:[],transactions:[],profiles:[]};let realtimeChannel=null;let reloadTimer=null;
const $=s=>document.querySelector(s);const fmt=new Intl.NumberFormat('zh-CN');const todayISO=()=>new Date().toISOString().slice(0,10);const dateFormat=d=>new Date(`${d}T00:00:00`).toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric'});const escapeHTML=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function student(id){return data.students.find(s=>s.id===id)}function balance(id){return data.transactions.filter(t=>t.student_id===id&&(t.type==='deposit'||t.type==='withdraw')).reduce((sum,t)=>sum+(t.type==='deposit'?t.amount:-t.amount),0)}function cardBalance(id){return data.transactions.filter(t=>t.student_id===id&&(t.type==='card'||t.type==='cardWithdraw')).reduce((sum,t)=>sum+(t.type==='card'?t.amount:-t.amount),0)}function orderedTransactions(){return [...data.transactions].sort((a,b)=>b.occurred_on.localeCompare(a.occurred_on)||b.created_at.localeCompare(a.created_at))}function profileName(id){return data.profiles.find(p=>p.id===id)?.display_name||'员工'}

function currentWeek(){const now=new Date(),day=now.getDay()||7,start=new Date(now);start.setDate(now.getDate()-day+1);start.setHours(0,0,0,0);return start.toISOString().slice(0,10)}

function populateStudentSelect(){const sel=$('#transaction-student'),old=sel.value;sel.innerHTML=data.students.map(s=>`<option value="${s.id}">${escapeHTML(s.name)}（宝币 ${balance(s.id)}，存卡 ${cardBalance(s.id)} 张）</option>`).join('');if(old)sel.value=old}function renderAll(){renderDashboard();renderStudents();renderLedger();populateStudentSelect()}
